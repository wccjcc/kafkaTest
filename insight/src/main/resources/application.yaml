spring:
  application:
    name: ${SPRING_APPLICATION_NAME:insight}
  datasource:
    url: ${INSIGHT_DB_URL:jdbc:mysql://localhost:3306/insight?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${INSIGHT_DB_USERNAME:root}
    password: ${INSIGHT_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
    show-sql: ${JPA_SHOW_SQL:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:insight-group}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    topics:
      payment-created: ${PAYMENT_TOPIC:payment.created}

server:
  port: ${INSIGHT_SERVER_PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info}
